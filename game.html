<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mystery House - Game</title>
    <script src="script.js" defer></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 2em;
        }

        header nav ul {
            display: inline;
            padding: 0;
            margin-right: 1em;
        }

        header nav li {
            display: inline;
        }

        .header-box {
            border: 2px solid #8b0000;
            padding: 1em;
            background-color: #1a1a1a;
            text-align: left;
        }

        .card {
            border: 2px solid #444;
            padding: 1em;
            background-color: #1a1a1a;
            text-align: left;
            margin-bottom: 1em;
        }

        #inventory-display {
            font-weight: bold;
            color: #ff6b6b;
            background-color: #2a0808;
            padding: 5px;
            border: 1px solid #8b0000;
        }

        h1 {
            color: #ff4d4d;
            text-shadow: 1px 1px 2px black;
        }

        h2 {
            color: #cc0000;
        }

        a {
            color: #ff6b6b;
        }

        button {
            background-color: #8b0000;
            color: white;
            border: 1px solid #ff4d4d;
            padding: 8px 12px;
            cursor: pointer;
            margin: 4px;
        }

        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <header class="header-box">
      <nav>
            <ul> 
                <li><a href="index.html">Home</a></li>
            </ul>
            <ul> 
                <li><a href="game.html">Play the game</a></li>
            </ul>
            <ul> 
                <li><a href="about.html">About the creator</a></li>
            </ul>
        </nav>
    </header>

    <main class="card">
    <header class="card">
        <h1 id="scene-title">  </h1>
        <h2 id="character-name">  </h2>
    </header>
    
    <section>
    <p id="scene-text">     </p>

    </section>

    <section>
        <div id="choices-container"> </div>
    </section>   
        
    <section>
        <p> Current HP:</p>
        <ul>
            <li id="health-display"> 100</li>
        </ul>

        <p> Inventory:</p>
        <ul>
            <li id="inventory-display"> </li>
        </ul>

        <p id="message-display"></p>
    </section>


    </main>
    <footer>

    </footer>
</body>
</html>
