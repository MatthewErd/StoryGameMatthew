
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mystery House - Game</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="script.js" defer></script>

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
        }

        .navbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #8b0000;
        }

        .navbar-brand, .nav-link {
            color: #ff6b6b;
        }

        .navbar-brand:hover, .nav-link:hover {
            color: white;
        }

        .navbar .nav-link.active {
            color: white;
            font-weight: bold;
        }

        .heading {
            color: #ff4d4d;
        }

        h2 {
            color: #cc0000;
        }

        .card {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 2px solid #444;
        }

        #inventory-display {
            font-weight: bold;
            color: #ff6b6b;
            background-color: #2a0808;
            padding: 5px;
            border: 1px solid #8b0000;
        }

        #choices-container button {
            background-color: #8b0000;
            color: white;
            border: 1px solid #ff4d4d;
            padding: 8px 12px;
            margin: 4px;
            border-radius: 5px;
            cursor: pointer;
        }

        #choices-container button:hover {
            background-color: #cc0000;
        }

        #message-display {
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Mystery House</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="game.html">Play Game</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About Me</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <div class="row mb-4">
        <div class="col-md-12">
            <h1 id="scene-title" class="heading"></h1>
            <h2 id="character-name"></h2>
        </div>
    </div>

    <div class="row g-4">

        <div class="col-md-8">
            <div class="card p-4">
                <h3 class="text-danger">The Story</h3>

                <p id="scene-text"></p>

                <div id="choices-container"></div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card p-4">
                <h3 class="text-danger">Player Stats</h3>

                <p class="mt-3">Current HP:</p>
                <ul>
                    <li id="health-display">100</li>
                </ul>

                <p>Inventory:</p>
                <ul>
                    <li id="inventory-display">Empty</li>
                </ul>

                <p id="message-display"></p>
            </div>
        </div>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
