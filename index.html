<!DOCTYPE html>
<html>
<head>
    <title>The Mystery House</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: sans-serif;
            margin: 2em;
        }

        header {
            border: 2px solid gray;
            padding: 1em;
        }

        h1 {
            color: blue;
            font-size: 2em;
            text-decoration: underline;
        }

        form {
            border: 2px solid gray;
            padding: 1em;
            background-color: lightgray;
            width: 300px;
        }

        label {
            font-weight: bold;
        }

        a {
            color: blue;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header>
    <h1>The Mystery House</h1>
    <p>The goal is to find the secret inside the Mystery House</p>
</header>

<main>

    <p>You receive a note telling you to go an abandoned house. </p>

    <!-- Add your index page here -->
    <form action="game.html" method="get">

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <br><br>

        <label for="location">Where do you start?</label>
        <select id="location" name="location">
            <option value="door">Front Door</option>
            <option value="yard">Front Yard</option>
            <option value="window">Window</option>
        </select>

        <p>Choose your difficulty:</p>

        <input type="radio" id="easy" name="difficulty" value="easy">
        <label for="easy">Brave</label>

        <input type="radio" id="medium" name="difficulty" value="medium">
        <label for="medium">Careful</label>

        <input type="radio" id="hard" name="difficulty" value="hard">
        <label for="hard">Curious</label>

        <br><br>

        <button type="submit">Enter the House</button>

    </form>

    <br>

    <a href="about.html">About Me</a>
</main>

</body>
</html>
