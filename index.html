
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mystery House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
        }

        .navbar {
            background-color: #1a1a1a;
            border-bottom: 2px solid #8b0000;
        }

        .navbar-brand, .nav-link {
            color: #ff6b6b;
        }

        .navbar-brand:hover, .nav-link:hover {
            color: white;
        }

        .navbar .nav-link.active {
            color: white;
            font-weight: bold;
        }

        .heading {
            color: #ff4d4d;
        }

        .card {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 2px solid #444;
        }

        #special-intro {
            color: #ff6b6b;
        }

        .btn-danger {
            background-color: #8b0000;
            border-color: #ff4d4d;
        }

        .btn-danger:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg" data-bs-theme="dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Mystery House</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="game.html">Play Game</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About Me</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<header class="container mt-5">
    <div class="row">
        <div class="col-md-12 text-center">
            <h1 class="heading">The Mystery House</h1>
            <p>The goal is to find the secret inside the Mystery House</p>
        </div>
    </div>
</header>

<main class="container mt-4">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <p id="special-intro">
                You receive a note telling you to go to an abandoned house.
            </p>

            <form class="card p-4" action="game.html" method="get">

                <div class="mb-3">
                    <label for="name" class="form-label">Your Name:</label>
                    <input type="text" class="form-control"
                           id="name" name="name"
                           placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label for="location" class="form-label">
                        Where do you start?
                    </label>

                    <select class="form-select" id="location" name="location">
                        <option value="door">Front Door</option>
                        <option value="yard">Front Yard</option>
                        <option value="window">Window</option>
                    </select>
                </div>

                <p>Choose your style:</p>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           id="cautious" name="difficulty"
                           value="cautious">
                    <label class="form-check-label" for="cautious">
                        Cautious
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           id="balanced" name="difficulty"
                           value="balanced" checked>
                    <label class="form-check-label" for="balanced">
                        Balanced
                    </label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           id="bold" name="difficulty"
                           value="bold">
                    <label class="form-check-label" for="bold">
                        Bold
                    </label>
                </div>

                <button type="submit" class="btn btn-danger mt-4">
                    Enter the House
                </button>

            </form>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
