<!DOCTYPE html>
<html>
<head>
    <title>The Mystery House</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: sans-serif;
            margin: 2em;
        }

        .header {
            border: 2px solid #8b0000;
            padding: 1em;
            background-color: #1a1a1a;
        }

        .heading {
            font-size: 2em;
            color: #ff4d4d;
            background-color: #1a1a1a;
            padding: 1em;
        }

        .card {
            border: 2px solid #444;
            padding: 1em;
            background-color: #1a1a1a;
            text-align: left;
            width: 300px;
        }

        #special-intro {
            color: #ff6b6b;
        }

        label {
            font-weight: bold;
            color: #e0e0e0;
        }

        a {
            color: #ff6b6b;
            font-weight: bold;
        }

        button {
            background-color: #8b0000;
            color: white;
            border: 1px solid #ff4d4d;
            padding: 8px 12px;
            cursor: pointer;
        }

        button:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>

<header class="header">
    <h1 class="heading">The Mystery House</h1>
    <p>The goal is to find the secret inside the Mystery House</p>
</header>

<main>

    <p id="special-intro">You receive a note telling you to go to an abandoned house.</p>

    <form class="card" action="game.html" method="get">

        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <br><br>

        <label for="location">Where do you start?</label>
        <select id="location" name="location">
            <option value="door">Front Door</option>
            <option value="yard">Front Yard</option>
            <option value="window">Window</option>
        </select>

        <p>Choose your style:</p>

        <input type="radio" id="cautious" name="difficulty" value="cautious">
        <label for="cautious">Cautious</label>

        <input type="radio" id="balanced" name="difficulty" value="balanced">
        <label for="balanced">Balanced</label>

        <input type="radio" id="bold" name="difficulty" value="bold">
        <label for="bold">Bold</label>

        <br><br>

        <button type="submit">Enter the House</button>

    </form>

    <br>

    <a href="about.html">About Me</a>
</main>

</body>
</html>
